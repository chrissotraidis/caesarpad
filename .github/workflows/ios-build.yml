name: CaesarPad iOS preview

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch pinned SDL sources
        run: scripts/fetch-deps.sh

      - name: Repository safety
        run: scripts/check-repo-safety.sh

      - name: Touch regression tests
        run: scripts/test-touch.sh

      - name: Build unsigned iOS app
        run: scripts/build-device.sh

      - name: Package and audit IPA
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            label="${GITHUB_REF_NAME#v}"
            [[ "$label" == *-* ]] || { echo "Expected vVERSION-LABEL prerelease tag" >&2; exit 1; }
            export VERSION="${label%%-*}" RELEASE_LABEL="${label#*-}"
          else
            export RELEASE_LABEL="source-review-${GITHUB_SHA:0:7}"
          fi
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          scripts/package-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CaesarPad-iOS
          path: |
            build/release/*.ipa*
            build/release/*-source.tar.gz*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CaesarPad-iOS
          path: release-assets

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --prerelease
          --generate-notes
